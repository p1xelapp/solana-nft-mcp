# Dependency updates, batched so they arrive as one weekly pull request instead
# of one per package. Security advisories still open their own PR immediately -
# that behaviour is not configurable here, and it should not be: a real
# vulnerability is worth an interruption, a version bump is not.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    # A version published in the last week is not proposed yet. Compromised
    # releases are usually caught and pulled within days, and nothing here is
    # urgent enough to be an early adopter. Security advisories ignore this.
    cooldown:
      default-days: 7
    # Major versions are breaking by definition and arrive as a bot PR that
    # cannot pass CI on its own - TypeScript 7 against a linter that does not
    # support it yet, zod 4 against code written for zod 3. Those are upgrades
    # to sit down and do, not notifications to wake up to. Security advisories
    # ignore this filter entirely, which is the whole point.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for everything that only matters at build time.
      build-tooling:
        dependency-type: development
      # One PR for the two packages that actually ship.
      runtime:
        dependency-type: production
    commit-message:
      prefix: "deps"
