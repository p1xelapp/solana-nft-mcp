# CI backstop: secrets scan + strict build + offline protocol test on every push.
# The live smoke suite (npm test) talks to real endpoints, so it stays a local/dev
# command - CI must not hammer public APIs on every push, that's the polite-client
# rule applied to ourselves.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to full commit SHAs - a moved tag is a supply-chain vector.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans history

      # Full-history scan, not a diff of the pushed range. The gitleaks action
      # derives a commit range from the push event, which has no valid parent
      # for a repo's first push - it scanned ~0 bytes and still printed
      # "no leaks found". A gate that reports clean without reading anything is
      # worse than no gate, and this repo is going public, where every commit
      # ever made becomes readable. So: pinned binary, verified checksum,
      # whole history, every run.
      - name: Secrets scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks detect --source=. --redact --exit-code=1 --verbose

      # Runner's preinstalled Node (>=20) satisfies engines; no third-party setup action needed.
      - name: Install (locked)
        run: npm ci

      - name: Build (strict TypeScript)
        run: npm run build

      - name: Protocol test (offline - full MCP surface over real stdio)
        run: node test/protocol.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high
