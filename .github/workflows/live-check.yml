# This workflow exists to send exactly one email: the one that says a real source broke.
# Weekly, keyless, three live calls. A red run here means a venue changed or went
# away - not that our code changed, because nothing in this repo moved between runs.
name: live-check
on:
  schedule:
    # Mondays 09:00 America/Boise. GitHub cron is UTC only and does not observe
    # daylight saving, so this is pinned to 15:00 UTC = 09:00 MDT in summer and
    # 08:00 MST in winter. The hour it runs matters less than it running.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # The check itself budgets 90 seconds; 10 minutes covers install and build
    # and still fails fast if a source hangs the runner.
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA - a moved tag is a supply-chain vector.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install (locked)
        run: npm ci

      - name: Build
        run: npm run build

      # No secrets, no env: this proves the keyless path a new user gets.
      # OpenSea is deliberately not exercised here - it needs a key, and a
      # workflow that needs a key cannot tell us whether the zero-key promise
      # still holds.
      - name: Live source check
        run: node test/live.mjs
