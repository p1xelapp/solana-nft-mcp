# This workflow exists to send exactly one email: the one that says a real source broke.
# Weekly, keyless, five live calls. A red run here means a venue changed or went
# away - not that our code changed, because nothing in this repo moved between runs.
name: live-check
on:
  schedule:
    # Mondays 15:00 UTC. The hour it runs matters less than it running.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # A red run is an email that gets buried. An issue stays open until someone
  # closes it, and a webhook reaches a phone. Both below.
  issues: write
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # The check itself budgets 90 seconds; 10 minutes covers install and build
    # and still fails fast if a source hangs the runner.
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA - a moved tag is a supply-chain vector.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Setup is SEPARATE from the source check, and named so, because this
      # workflow's whole purpose is to send exactly one email: "a real source
      # broke". An npm registry outage failing `npm ci` used to turn the run
      # red while every source was perfectly healthy - the same red, the same
      # email, a different meaning. Keeping them as distinct steps means the
      # failing step name says which happened, and a setup failure is visibly
      # not a source break.
      # `id` + an output on each setup step so the explanation below can name
      # WHICH part of the runner failed. `steps.<id>.outcome` is only ever
      # 'success', 'failure', 'cancelled' or 'skipped' - never an empty string -
      # so the old `== ''` test never matched and the explanation never ran.
      - name: Setup - install (locked)
        id: install
        run: |
          npm ci
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Setup - build
        id: build
        run: |
          npm run build
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # No secrets: this proves the keyless path a new user gets. The child
      # runs with automatic key issue and the update check switched off, so
      # OpenSea is deliberately not exercised here and nothing is provisioned
      # on a CI runner.
      #
      # THIS is the step whose failure means a source broke. If the run is red
      # and this step was skipped or never started, the sources were never
      # asked.
      # The check exits 0 for an optional source's outage, so a green tick alone
      # does not mean every source answered. Its last line is a verdict -
      # RESULT: PASSED | DEGRADED (source) | FAILED (...) - and that line is
      # echoed into the run summary so the state is readable without opening
      # the log.
      - name: Live source check (a failure HERE means a source broke)
        id: live
        run: |
          set -o pipefail
          node test/live.mjs | tee live-output.txt
          verdict="$(grep '^RESULT: ' live-output.txt | tail -1)"
          echo "verdict=${verdict:-RESULT: UNKNOWN (no verdict line printed)}" >> "$GITHUB_OUTPUT"
          echo "### Live source check" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${verdict:-RESULT: UNKNOWN (no verdict line printed)}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the verdict
        if: always() && steps.live.outcome != 'skipped'
        run: |
          echo "::notice::${{ steps.live.outputs.verdict || 'RESULT - FAILED (the live check did not print a verdict)' }}"

      # A skipped step's outcome is the literal string 'skipped', not ''. With
      # the old `== ''` test this explanation never ran, and a red run caused by
      # the npm registry looked exactly like a broken venue.
      - name: Explain a setup failure
        if: failure() && steps.live.outcome == 'skipped'
        run: |
          if [ "${{ steps.install.outputs.ok }}" != "true" ]; then
            where="installing dependencies (npm ci) - the npm registry or the lockfile"
          elif [ "${{ steps.build.outputs.ok }}" != "true" ]; then
            where="the TypeScript build - this repository's own code, not a venue"
          else
            where="the runner, before the live check could start"
          fi
          echo "::warning::This run failed BEFORE the live source check ran, at: ${where}. No source was contacted, so this is NOT evidence that a venue broke."
          echo "### Not a source break" >> "$GITHUB_STEP_SUMMARY"
          echo "This run failed at: ${where}. No source was contacted." >> "$GITHUB_STEP_SUMMARY"

      # A source break or a degraded source becomes ONE open issue, updated on
      # each later run rather than duplicated, so the repo itself shows what is
      # currently broken. It closes by hand once the fix ships. DEGRADED exits
      # 0 above on purpose (an optional source's outage is theirs), but it is still the
      # signal a maintainer wants, so it lands here too.
      - name: Open or update the source-break issue
        if: "always() && steps.live.outcome != 'skipped' && (steps.live.outcome == 'failure' || startsWith(steps.live.outputs.verdict, 'RESULT: DEGRADED'))"
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.live.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live source check: a source is not answering"
          body="$(printf '%s\n\n%s\n\nRun: %s\n\nWhat to do: open docs/MAINTENANCE.md, find the row for the source named above, follow its repair column. Close this issue when a run is green again.' "$(date -u +'%Y-%m-%d %H:%MZ')" "$VERDICT" "$RUN_URL")"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # Optional phone-reaching alert. Set the LIVE_CHECK_WEBHOOK repository
      # secret to a Discord (or Slack-compatible) webhook URL; with it unset
      # this step does nothing and says so.
      - name: Ping the alert webhook, if one is configured
        if: "always() && steps.live.outcome != 'skipped' && (steps.live.outcome == 'failure' || startsWith(steps.live.outputs.verdict, 'RESULT: DEGRADED'))"
        env:
          HOOK: ${{ secrets.LIVE_CHECK_WEBHOOK }}
          VERDICT: ${{ steps.live.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$HOOK" ]; then echo "no LIVE_CHECK_WEBHOOK secret set; skipping the webhook ping"; exit 0; fi
          payload="$(node -e 'const [v,u]=process.argv.slice(1);process.stdout.write(JSON.stringify({content:`collector-mcp weekly source check: ${v}\n${u}`}))' "$VERDICT" "$RUN_URL")"
          curl -fsS -H 'Content-Type: application/json' -d "$payload" "$HOOK" >/dev/null && echo "webhook pinged"
