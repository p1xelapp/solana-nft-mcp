  <rect x="694" y="78" width="462" height="170" rx="12" fill="#0a0d16" stroke="#a78bfa" stroke-opacity=".38"/><text x="712" y="98" font-size="10.5" letter-spacing="1.4" fill="#a78bfa" font-family="'IBM Plex Mono',ui-monospace,monospace">TIER 1 · CHAIN TRUTH</text><circle cx="712" cy="120" r="3" fill="#a78bfa"/><text x="726" y="124" font-size="12.5" fill="#dfe4f2">Your own Solana RPC endpoint</text><text x="1138" y="124" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><circle cx="712" cy="146" r="3" fill="#a78bfa"/><text x="726" y="150" font-size="12.5" fill="#dfe4f2">Solana public mainnet RPC</text><text x="1138" y="150" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><circle cx="712" cy="172" r="3" fill="#a78bfa"/><text x="726" y="176" font-size="12.5" fill="#dfe4f2">PublicNode Solana RPC</text><text x="1138" y="176" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><circle cx="712" cy="198" r="3" fill="#a78bfa"/><text x="726" y="202" font-size="12.5" fill="#dfe4f2">LeoRPC public Solana endpoint</text><text x="1138" y="202" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><circle cx="712" cy="224" r="3" fill="#a78bfa"/><text x="726" y="228" font-size="12.5" fill="#dfe4f2">Metaplex Core program and docs</text><text x="1138" y="228" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><rect x="694" y="260" width="462" height="118" rx="12" fill="#0a0d16" stroke="#22d3ee" stroke-opacity=".38"/><text x="712" y="280" font-size="10.5" letter-spacing="1.4" fill="#22d3ee" font-family="'IBM Plex Mono',ui-monospace,monospace">TIER 2 · VENUE AND INDEX</text><circle cx="712" cy="302" r="3" fill="#22d3ee"/><text x="726" y="306" font-size="12.5" fill="#dfe4f2">Asset index (DAS) on the public Solana RPC</text><text x="1138" y="306" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><circle cx="712" cy="328" r="3" fill="#22d3ee"/><text x="726" y="332" font-size="12.5" fill="#dfe4f2">Magic Eden v2</text><text x="1138" y="332" text-anchor="end" font-size="10.5" fill="#5f6883" font-family="'IBM Plex Mono',ui-monospace,monospace">no key</text><circle cx="712" cy="354" r="3" fill="#22d3ee"/><text x="726" y="358" font-size="12.5" fill="#dfe4f2">OpenSea v2</text><text x="1138" y="358" text-anchor="end" font-size="10.5" fill="#f5c04a" font-family="'IBM Plex Mono',ui-monospace,monospace">key</text>

  <text x="24" y="388" font-size="11" fill="#5f6883">A source marked <tspan fill="#f5c04a">key</tspan> needs one. The server asks OpenSea for a free key of its own on first need and keeps it on your machine.</text>
  <text x="24" y="406" font-size="11" fill="#5f6883">Every item answer also links Solscan, SolanaFM, Solana Explorer, XRAY so you can check it without trusting this server.</text>
