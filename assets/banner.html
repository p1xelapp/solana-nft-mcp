<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100vh;overflow:hidden}
  body{
    background:#04050a;
    font-family:'Inter',system-ui,sans-serif;
    color:#fff;
    position:relative;
  }
  /* the light in the room */
  .glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
  .g1{width:760px;height:760px;right:-180px;top:-260px;background:radial-gradient(circle,rgba(139,92,246,.72),rgba(139,92,246,0) 68%)}
  .g2{width:700px;height:700px;right:-60px;bottom:-330px;background:radial-gradient(circle,rgba(20,241,149,.52),rgba(20,241,149,0) 66%)}
  .g3{width:620px;height:620px;right:130px;top:130px;background:radial-gradient(circle,rgba(34,211,238,.44),rgba(34,211,238,0) 68%)}
  .g4{width:900px;height:620px;left:-320px;top:60px;background:radial-gradient(circle,rgba(99,102,241,.30),rgba(99,102,241,0) 70%)}
  .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.60) 100%)}

  .wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 546px;align-items:center}

  .left{padding:0 0 0 68px}
  .word{font-size:88px;font-weight:800;letter-spacing:-.045em;line-height:1;white-space:nowrap}
  .word .mcp{background:linear-gradient(95deg,#a78bfa 0%,#22d3ee 62%,#14f195 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:15px;font-size:31px;white-space:nowrap;font-weight:600;letter-spacing:-.02em;color:#f2f4fb}
  .line{margin-top:26px;font-size:20.5px;font-weight:500;color:#96a0bb;letter-spacing:-.005em}
  .chips{margin-top:30px;display:flex;gap:11px}
  .chip{display:flex;align-items:center;gap:8px;padding:10px 17px 10px 14px;border-radius:999px;border:1.6px solid;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;white-space:nowrap;color:#e8ecf7;background:rgba(255,255,255,.028)}
  .c1{border-color:rgba(167,139,250,.85);box-shadow:0 0 18px rgba(167,139,250,.28),inset 0 0 12px rgba(167,139,250,.08)}
  .c2{border-color:rgba(129,140,248,.85);box-shadow:0 0 18px rgba(129,140,248,.26),inset 0 0 12px rgba(129,140,248,.08)}
  .c3{border-color:rgba(34,211,238,.85);box-shadow:0 0 18px rgba(34,211,238,.26),inset 0 0 12px rgba(34,211,238,.08)}
  .c4{border-color:rgba(20,241,149,.85);box-shadow:0 0 18px rgba(20,241,149,.26),inset 0 0 12px rgba(20,241,149,.08)}
  .chip svg{display:block}
  .foot{position:absolute;left:70px;bottom:40px;font-family:'IBM Plex Mono',monospace;font-size:15px;color:#5f6883;letter-spacing:.02em}

  .right{position:relative;height:100%}
</style>
</head>
<body>
  <div class="glow g4"></div>
  <div class="glow g1"></div>
  <div class="glow g3"></div>
  <div class="glow g2"></div>
  <div class="vig"></div>

  <div class="wrap">
    <div class="left">
      <div class="word">collector-<span class="mcp">mcp</span></div>
      <div class="sub">Solana collectibles, straight from the chain</div>
      <div class="line">Read-only, no sign-up, runs on your machine.</div>
      <div class="chips">
        <span class="chip c1"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="9" cy="9" r="1.4" fill="#a78bfa" stroke="none"/></svg>NFTs</span>
        <span class="chip c2"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>provenance</span>
        <span class="chip c3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="7.5" width="18" height="11.5" rx="2.5"/><circle cx="16.5" cy="13" r="1.4" fill="#22d3ee" stroke="none"/></svg>wallets</span>
        <span class="chip c4"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14f195" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>sales</span>
      </div>
      <div class="foot">p1xel.app/collector-mcp</div>
    </div>

    <div class="right">
      <svg width="540" height="630" viewBox="0 0 540 630" fill="none" style="position:absolute;right:-6px;top:0">
        <defs>
          <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
          <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
          <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#14f195"/></linearGradient>
          <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/></linearGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
          <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <mask id="mfade"><rect x="0" y="470" width="540" height="150" fill="url(#fade)"/></mask>
        </defs>

        <!-- the orbit the cards sit in -->
        <ellipse cx="268" cy="300" rx="228" ry="112" transform="rotate(-13 268 300)" stroke="#4b5aa8" stroke-opacity=".55" stroke-width="1.6"/>
        <circle cx="44" cy="264" r="9" fill="#a78bfa"/><circle cx="44" cy="264" r="16" fill="#a78bfa" opacity=".28" filter="url(#soft2)"/>
        <circle cx="448" cy="228" r="7" fill="#22d3ee"/><circle cx="448" cy="228" r="14" fill="#22d3ee" opacity=".3" filter="url(#soft2)"/>
        <circle cx="362" cy="404" r="8.5" fill="#14f195"/><circle cx="362" cy="404" r="16" fill="#14f195" opacity=".3" filter="url(#soft2)"/>

        <!-- back card, green -->
        <g transform="rotate(9 300 300)">
          <rect x="286" y="168" width="176" height="248" rx="22" fill="#0a1220" fill-opacity=".72" stroke="url(#gg)" stroke-width="2.6"/>
          <rect x="286" y="168" width="176" height="248" rx="22" stroke="#14f195" stroke-opacity=".45" stroke-width="7" filter="url(#soft)"/>
          <circle cx="430" cy="200" r="9" fill="#14f195" fill-opacity=".8"/>
          <rect x="312" y="300" width="112" height="15" rx="7.5" fill="#14f195" fill-opacity=".20"/>
          <rect x="312" y="328" width="74" height="15" rx="7.5" fill="#14f195" fill-opacity=".14"/>
        </g>
        <!-- middle card, blue -->
        <g transform="rotate(3 290 300)">
          <rect x="216" y="150" width="184" height="262" rx="23" fill="#080f1c" fill-opacity=".86" stroke="url(#gb)" stroke-width="2.6"/>
          <rect x="216" y="150" width="184" height="262" rx="23" stroke="#3b82f6" stroke-opacity=".45" stroke-width="7" filter="url(#soft)"/>
          <circle cx="366" cy="184" r="9" fill="#60a5fa" fill-opacity=".85"/>
          <rect x="242" y="296" width="118" height="16" rx="8" fill="#60a5fa" fill-opacity=".20"/>
          <rect x="242" y="326" width="78" height="16" rx="8" fill="#60a5fa" fill-opacity=".14"/>
        </g>
        <!-- front card, violet, carries the mark -->
        <g transform="rotate(-4 250 310)">
          <rect x="128" y="138" width="196" height="282" rx="25" fill="#070b16" fill-opacity=".94" stroke="url(#gv)" stroke-width="2.8"/>
          <rect x="128" y="138" width="196" height="282" rx="25" stroke="#a78bfa" stroke-opacity=".5" stroke-width="8" filter="url(#soft)"/>
          <circle cx="290" cy="172" r="9.5" fill="#c4b5fd" fill-opacity=".9"/>
          <!-- Solana mark -->
          <g transform="translate(158 206) scale(1.32)">
            <path d="M14.6 30.4a1.5 1.5 0 0 1 1.06-.44h48.1c.67 0 1 .81.53 1.28l-9.5 9.5a1.5 1.5 0 0 1-1.06.44H5.63c-.67 0-1-.81-.53-1.28z" fill="url(#sol)"/>
            <path d="M14.6 1.44A1.5 1.5 0 0 1 15.66 1h48.1c.67 0 1 .81.53 1.28l-9.5 9.5a1.5 1.5 0 0 1-1.06.44H5.63c-.67 0-1-.81-.53-1.28z" fill="url(#sol)"/>
            <path d="M54.29 15.83a1.5 1.5 0 0 0-1.06-.44H5.13c-.67 0-1 .81-.53 1.28l9.5 9.5c.28.28.66.44 1.06.44h48.1c.67 0 1-.81.53-1.28z" fill="url(#sol)"/>
          </g>
          <rect x="154" y="306" width="132" height="17" rx="8.5" fill="#a78bfa" fill-opacity=".26"/>
          <rect x="154" y="338" width="88" height="17" rx="8.5" fill="#a78bfa" fill-opacity=".16"/>
        </g>

        <!-- what the light does to the floor -->
        <g mask="url(#mfade)" opacity=".30">
          <rect x="150" y="474" width="200" height="60" rx="30" fill="#a78bfa" filter="url(#soft)"/>
          <rect x="250" y="480" width="170" height="52" rx="26" fill="#22d3ee" filter="url(#soft)"/>
          <rect x="330" y="486" width="150" height="48" rx="24" fill="#14f195" filter="url(#soft)"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
