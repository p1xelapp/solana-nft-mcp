<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- collector-mcp social banner / OG image (render to PNG at 1280x640) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1c"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c04a"/>
      <stop offset="1" stop-color="#c8871a"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2140"/>
      <stop offset="1" stop-color="#0d1226"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- faint grid, data-instrument feel -->
  <g stroke="#1c2544" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280 M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <!-- LEFT: wordmark + message -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    <text x="90" y="205" font-size="64" font-weight="700" fill="#f2f5ff" letter-spacing="-1">collector-mcp</text>
    <text x="90" y="262" font-size="27" fill="#8fa0c9">Give your AI eyes on digital collectibles.</text>
    <text x="90" y="300" font-size="27" fill="#8fa0c9">Not keys to them.</text>

    <!-- chips -->
    <g font-size="21" font-weight="600">
      <rect x="90" y="345" rx="19" width="176" height="42" fill="none" stroke="#f5c04a" stroke-width="2"/>
      <text x="178" y="372" text-anchor="middle" fill="#f5c04a">0 API KEYS</text>
      <rect x="286" y="345" rx="19" width="176" height="42" fill="none" stroke="#3ddc97" stroke-width="2"/>
      <text x="374" y="372" text-anchor="middle" fill="#3ddc97">READ-ONLY</text>
      <rect x="482" y="345" rx="19" width="150" height="42" fill="none" stroke="#8fa0c9" stroke-width="2"/>
      <text x="557" y="372" text-anchor="middle" fill="#8fa0c9">8 TOOLS</text>
    </g>

    <text x="90" y="455" font-size="23" fill="#5d6c94">Solana · Candy Digital · Panini · Metaplex Core</text>
    <text x="90" y="545" font-size="25" fill="#f2f5ff">github.com/p1xelapp/collector-mcp</text>
    <text x="90" y="580" font-size="21" fill="#5d6c94">MIT · works with Claude Desktop, Claude Code, Cursor</text>
  </g>

  <!-- RIGHT: the card with provenance timeline -->
  <g transform="translate(880 90) rotate(5)">
    <rect x="0" y="0" width="290" height="410" rx="22" fill="url(#cardbg)" stroke="url(#gold)" stroke-width="7"/>
    <rect x="22" y="22" width="246" height="366" rx="12" fill="none" stroke="#2a3354" stroke-width="2"/>
    <g font-family="ui-monospace, Consolas, monospace">
      <text x="145" y="64" text-anchor="middle" font-size="21" fill="#8fa0c9" letter-spacing="2">PROVENANCE</text>
    </g>
    <!-- timeline -->
    <path d="M80 340 V110" stroke="#2a3354" stroke-width="4"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="19">
      <circle cx="80" cy="340" r="10" fill="#0b0e1c" stroke="#3ddc97" stroke-width="5"/>
      <text x="106" y="347" fill="#8fa0c9">minted</text>
      <circle cx="80" cy="270" r="9" fill="#3ddc97"/>
      <text x="106" y="277" fill="#8fa0c9">listed · ME</text>
      <circle cx="80" cy="200" r="9" fill="#3ddc97"/>
      <text x="106" y="207" fill="#f2f5ff">SOLD · 2.1 SOL</text>
      <g transform="translate(80 130)">
        <circle r="14" fill="url(#gold)"/>
        <path d="M0 -7 L2 -2.2 L7.3 -1.7 L3.2 1.7 L4.5 6.9 L0 4.1 L-4.5 6.9 L-3.2 1.7 L-7.3 -1.7 L-2 -2.2 Z" fill="#0b0e1c"/>
      </g>
      <text x="106" y="137" fill="#f5c04a">owner · FfRv..</text>
      <text x="145" y="378" text-anchor="middle" font-size="17" fill="#5d6c94">1/250 · verified on-chain</text>
    </g>
  </g>
</svg>
