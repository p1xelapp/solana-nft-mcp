<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- collector-mcp mark: a trading card whose provenance chain runs through it -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c04a"/>
      <stop offset="1" stop-color="#c8871a"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a2e"/>
      <stop offset="1" stop-color="#0b0e1c"/>
    </linearGradient>
  </defs>
  <!-- card -->
  <g transform="rotate(-6 128 128)">
    <rect x="58" y="34" width="140" height="188" rx="14" fill="url(#cardbg)" stroke="url(#gold)" stroke-width="5"/>
    <!-- inner frame -->
    <rect x="70" y="46" width="116" height="164" rx="8" fill="none" stroke="#2a3354" stroke-width="2"/>
    <!-- provenance chain: mint -> transfer -> transfer -> owner -->
    <path d="M100 190 L100 152 L128 128 L128 96 L156 72" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="190" r="9" fill="#0b0e1c" stroke="#3ddc97" stroke-width="5"/>
    <circle cx="100" cy="152" r="7" fill="#3ddc97"/>
    <circle cx="128" cy="128" r="7" fill="#3ddc97"/>
    <circle cx="128" cy="96" r="7" fill="#3ddc97"/>
    <!-- current owner: gold star node -->
    <g transform="translate(156 72)">
      <circle r="13" fill="url(#gold)"/>
      <path d="M0 -6.5 L1.9 -2 L6.8 -1.6 L3 1.6 L4.2 6.4 L0 3.8 L-4.2 6.4 L-3 1.6 L-6.8 -1.6 L-1.9 -2 Z" fill="#0b0e1c"/>
    </g>
    <!-- serial number notch, the collector detail -->
    <text x="128" y="204" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8fa0c9" letter-spacing="1">1/1</text>
  </g>
</svg>
