# Gitleaks config. Default rules stay on.
#
# The captured marketplace feeds under test/fixtures are full of base58 mint and
# wallet addresses in fields named tokenMint / token_address, and exactly ONE
# default rule reads those as credentials: `generic-api-key` (measured - 126
# findings, all of them that rule, and no other rule fires on the fixtures).
#
# The allowlist is scoped to that rule and those paths, and to nothing else.
# The previous path-wide form suppressed EVERY default rule for every JSON file
# under test/fixtures, so a real GitHub PAT committed as test/fixtures/leak.json
# passed a full-history scan clean. Verified both ways with gitleaks 8.30.1:
# under the old config a planted `ghp_...` in that directory was "no leaks
# found"; under this one it is caught, while the 126 address false positives
# stay suppressed.
#
# `[[allowlists]]` with `targetRules` needs gitleaks >= 8.27, which is why the
# binary pinned in CI is 8.30.1. Do not lower it without re-checking that a
# planted secret in test/fixtures still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Offline test fixtures: captured public marketplace responses (base58 chain addresses, not secrets)"
targetRules = ["generic-api-key"]
paths = ['''test/fixtures/.*\.json$''']
